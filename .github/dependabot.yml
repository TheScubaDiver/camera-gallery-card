version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # typescript-eslint 8.x peers on typescript <6.1, so a TS 7 bump breaks
      # `npm ci` (ERESOLVE) and takes the whole dev-tooling group down with it.
      # Drop this once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # Bundle all dev-tooling updates into a single weekly PR.
      # Production deps (lit) are not in this group, so they always get an
      # individual PR for careful review — they affect the shipped bundle.
      dev-tooling:
        dependency-type: development
        update-types:
          - "major"
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
